version: "3.9"

services:
  gateway:
    build: .
    container_name: orca-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database across restarts. A named volume, not a
      # ./data bind mount: the image runs as uid 1000 ("gateway"), and on a
      # fresh clone Docker creates a missing bind-mount directory owned by
      # root, so SQLite could not open the file and the app exited during
      # startup with "unable to open database file". Docker seeds a named
      # volume from the image's /app/data, which is already owned by the
      # container user.
      - orca-data:/app/data
      # Live-reload config files without rebuilding the image
      - ./nodes.yaml:/app/nodes.yaml:ro
      - ./models.yaml:/app/models.yaml:ro
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/platform.db
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Use host network if your workers are on the same LAN (simplest option)
    # network_mode: host
    # Or use bridge (default) and make sure worker IPs are routable from container

volumes:
  orca-data:
